name: Données réelles
# Télécharge de vraies données (STAC-PLANET du PDSSP, PDS, JPL Horizons) et commite les aperçus légers dans data/.
on:
  workflow_dispatch:
    inputs:
      recettes:
        description: 'Recettes à relancer, séparées par des espaces (vide = toutes)'
        required: false
  push:
    branches: [main]
    paths: ['tools/data/**', '.github/workflows/data.yml']
permissions:
  contents: write
concurrency: { group: data, cancel-in-progress: true }
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install --quiet requests pillow numpy matplotlib
      - run: python tools/data/fetch_data.py ${{ github.event.inputs.recettes }}
      - run: python tools/data/fetch_orbits.py
      - name: Registre des crédits et licences (CREDITS.md, data/credits.json, licence dans chaque data/*.json)
        run: python tools/data/credits.py
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Reconstruire le site avec les nouvelles données
        run: node build.js
      - name: Commiter les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data index.html CREDITS.md
          git diff --cached --quiet && echo "Rien de nouveau" && exit 0
          git commit -m "Données réelles : mise à jour"
          git pull --rebase origin main
          git push
